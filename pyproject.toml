[project]
name = "precedent"
version = "0.1.0"
description = "An autonomous AI worker that learns how a company operates, does the work, and proves it."
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0",
  "google-auth>=2.30,<3",
  "openai>=1.40",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "playwright>=1.47",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "fpdf2>=2.7",
  "pypdf>=4.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "sse-starlette>=2.1",
  "google-adk[mcp]>=2.11,<3",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[project.scripts]
precedent = "precedent.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/precedent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
