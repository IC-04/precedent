<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Inbox{% endblock %} · Mail</title>
<style>
  body { margin: 0; font: 14px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: #202124; background: #fff; display: grid; grid-template-columns: 200px 1fr; min-height: 100vh; }
  aside { background: #eaf1fb; padding: 18px 14px; }
  aside .brand { font-size: 20px; color: #1a56c4; font-weight: 600; margin-bottom: 18px; }
  aside a { display: block; color: #1f1f1f; text-decoration: none; padding: 6px 10px; border-radius: 16px; }
  aside a.on { background: #d3e3fd; font-weight: 600; }
  aside .who { font-size: 12px; color: #5f6368; margin-top: 24px; }
  main { padding: 14px 22px; }
  form.search { display: flex; gap: 8px; margin-bottom: 12px; }
  form.search input { flex: 1; max-width: 520px; padding: 8px 14px; border: 0; background: #e9eef6; border-radius: 22px; font: inherit; }
  form.search button { border: 0; background: #1a56c4; color: #fff; border-radius: 18px; padding: 6px 16px; font: inherit; }
  ul.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid #e0e0e0; }
  ul.list li a { display: grid; grid-template-columns: 220px 1fr 140px; gap: 12px; padding: 9px 8px; border-bottom: 1px solid #eee; color: inherit; text-decoration: none; }
  ul.list li a:hover { background: #f2f6fc; }
  .from { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .date { color: #5f6368; text-align: right; font-size: 13px; }
  .clip { color: #5f6368; font-size: 12px; }
  h1 { font-size: 22px; font-weight: 400; margin: 6px 0 12px; }
  .meta { color: #5f6368; font-size: 13px; margin-bottom: 16px; }
  .body { white-space: pre-wrap; max-width: 760px; }
  .files { margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; }
  .files div { border: 1px solid #dadce0; border-radius: 8px; padding: 10px 14px; }
  .pager { margin: 10px 0; display: flex; gap: 16px; font-size: 13px; }
  .error { color: #b3261e; }
</style>
</head>
<body>
{% import "_macros.html" as m with context %}
<aside>
  <div class="brand">Mail</div>
  <nav aria-label="Mail folders"><a class="on" href="/mail/">Inbox</a></nav>
  <div class="who">Shared mailbox: Accounts payable. Signed in as Ava (AP).</div>
</aside>
<main>
  <form class="search" method="get" action="/mail/" role="search">
    <label for="f-q" style="position:absolute;left:-9999px">Search mail</label>
    <input id="f-q" name="q" value="{{ q if q is defined else '' }}" placeholder="Search mail">
    <button type="submit">Search mail</button>
  </form>
  {% block content %}{% endblock %}
</main>
</body>
</html>
