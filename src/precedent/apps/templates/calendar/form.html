{% extends "calendar/base.html" %}{% block content %}<div class="meeting-heading"><div><p class="eyebrow">Keep a little time aside</p><h1>{{ 'Edit local hold' if event_id else 'New local hold' }}</h1><p class="muted">Tentative on your calendar. No invitations are sent.</p></div></div>{% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
<form class="meeting-paper meeting-form" method="post"><input type="hidden" name="version" value="{{ values.version|default(0) }}"><label>Calendar<select name="calendar_id">{% for c in calendars if c.writable %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></label><label>Title<input name="title" value="{{ values.title|default('') }}" required></label><div class="form-row"><label>Start ({{ cfg.timezone }})<input name="start_at" type="datetime-local" value="{{ values.start_at|local_input(cfg.timezone) if values.start_at else '' }}" required></label><label>End ({{ cfg.timezone }})<input name="end_at" type="datetime-local" value="{{ values.end_at|local_input(cfg.timezone) if values.end_at else '' }}" required></label></div><label>Intended participant<select name="participant_id"><option value="">None</option>{% for p in contacts if p.id!=organizer.id %}<option value="{{ p.id }}" {% if values.participant_id==p.id %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select></label><label>Linked draft ID<input name="draft_id" value="{{ values.draft_id|default('') }}" placeholder="Optional saved draft ID"></label><button class="primary">Save local hold</button></form>{% endblock %}
