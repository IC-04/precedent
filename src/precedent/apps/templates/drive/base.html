<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}My drive{% endblock %} · Drive</title>
<style>
  body { margin: 0; font: 14px/1.5 "Trebuchet MS", Verdana, sans-serif; color: #2b2b2b; background: #f8f8f8; }
  header { background: #fff; border-bottom: 1px solid #ddd; padding: 12px 24px; display: flex; gap: 18px; align-items: center; }
  header .brand { font-weight: bold; color: #444; font-size: 18px; }
  header .brand span { color: #e8a317; }
  header a { color: #444; }
  header .user { margin-left: auto; font-size: 12px; color: #777; }
  main { padding: 18px 24px; max-width: 1100px; }
  .crumbs { color: #777; margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 14px; }
  .card a { font-weight: bold; color: #2b2b2b; text-decoration: none; }
  .card small { display: block; color: #888; margin-top: 4px; }
  table { border-collapse: collapse; width: 100%; background: #fff; border: 1px solid #ddd; }
  th, td { padding: 8px 10px; border-bottom: 1px solid #eee; text-align: left; }
  th { color: #777; font-weight: normal; }
  pre.text { white-space: pre-wrap; background: #fff; border: 1px solid #ddd; padding: 16px; font: 13px/1.5 Menlo, Consolas, monospace; }
  .error { color: #a00; }
</style>
</head>
<body>
<header>
  <span class="brand">Drive<span>.</span></span>
  <a href="/drive/">My drive</a>
  <span class="user">Ava (AP)</span>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
