<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Books{% endblock %} · Books</title>
<style>
  body { margin: 0; font: 14px/1.45 Georgia, "Times New Roman", serif; background: #f4f7f2; color: #1d2a1d; }
  header { background: #1f5a37; color: #fff; padding: 10px 24px; display: flex; gap: 28px; align-items: baseline; }
  header .brand { font-weight: bold; font-size: 18px; letter-spacing: .5px; }
  header nav a { color: #d9f0df; margin-right: 18px; text-decoration: none; }
  header nav a:hover { text-decoration: underline; }
  header .user { margin-left: auto; font-size: 13px; color: #cfe6d5; }
  main { padding: 18px 24px; max-width: 1180px; }
  h1 { font-size: 22px; margin: 6px 0 14px; }
  h2 { font-size: 16px; margin: 22px 0 8px; border-bottom: 1px solid #c7d6c7; padding-bottom: 4px; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { border: 1px solid #d5e0d5; padding: 4px 8px; text-align: left; vertical-align: top; }
  th { background: #e6efe6; font-weight: normal; font-variant: small-caps; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  a { color: #1f5a37; }
  .banner { background: #e2f3e5; border: 1px solid #8cc39a; padding: 8px 12px; margin-bottom: 14px; }
  .error { background: #fbeaea; border: 1px solid #d99; padding: 8px 12px; margin-bottom: 14px; }
  .field { margin-bottom: 10px; display: grid; grid-template-columns: 180px 1fr; gap: 8px; align-items: center; max-width: 640px; }
  .field .hint { grid-column: 2; font-size: 12px; color: #567; }
  input, select, textarea { font: inherit; padding: 4px 6px; border: 1px solid #9fb59f; background: #fff; }
  button { font: inherit; background: #1f5a37; color: #fff; border: 0; padding: 6px 14px; cursor: pointer; }
  button.secondary { background: #6b7d6b; }
  form.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 12px; background: #fff; padding: 10px; border: 1px solid #d5e0d5; }
  form.filters .field { display: block; margin: 0; }
  form.filters label { display: block; font-size: 12px; }
  dl.record { display: grid; grid-template-columns: 180px 1fr; gap: 4px 12px; background: #fff; padding: 12px; border: 1px solid #d5e0d5; max-width: 760px; }
  dl.record dt { color: #4b5d4b; } dl.record dd { margin: 0; }
  .actions { margin: 14px 0; display: flex; gap: 10px; align-items: center; }
  .pager { margin: 10px 0; display: flex; gap: 16px; }
  .status { font-variant: small-caps; }
</style>
</head>
<body>
{% import "_macros.html" as m with context %}
<header>
  <span class="brand">Books</span>
  <nav aria-label="Books">
    <a href="/books/bills">Bills</a>
    <a href="/books/bills/new">New bill</a>
    <a href="/books/vendors">Vendors</a>
    <a href="/books/history">History report</a>
  </nav>
  <span class="user">Signed in as Ava (AP)</span>
</header>
<main>
  {% if banner %}<p class="banner" role="status">{{ banner }}</p>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
